# MediaMTX settings for testing PROJECT_NAME's outbound modes (RTSP push, RTMP push, SRT caller).
# Written for MediaMTX v1.21.x. From the top folder of this repository, one command starts a receiver
# for all of them:
#
#   mediamtx test/mediamtx.yml
#
# Run it on a computer on the same network as the phone. The URLs below use 192.168.100.10 as that
# computer's address; put your computer's own address in its place. Settings this file leaves out keep
# MediaMTX's defaults.
#
# Anyone who can reach this computer may publish and watch without a password. Use it on a network you
# trust, and stop it (Ctrl+C) when the test is done.
#
# Firewall: allow incoming TCP 8554 and 1935, and UDP 8000, 8001 and 8890. With TLS on (see the RTSP
# and RTMP blocks), allow TCP 8322 and 1936 as well.
#
# A stream published with one protocol can be watched with any of the others. The examples use the path
# live/test for RTSP and RTMP, and test for SRT. Any other path name works too.

###############################################
# General

logLevel: info
logDestinations: [stdout]

###############################################
# Authentication: any client may publish and read on any path, with no user name or password.
# The API, metrics and pprof servers are off below, so no other permissions are needed.

authMethod: internal
authInternalUsers:
  - user: any
    pass:
    ips: []
    permissions:
      - action: publish
        path:
      - action: read
        path:

###############################################
# Servers these tests don't use: the control API, metrics, profiling, playback, HLS, WebRTC and MoQ.

api: false
metrics: false
pprof: false
playback: false
hls: false
webrtc: false
moq: false

###############################################
# RTSP on TCP 8554. Media goes over the TCP connection, or over UDP 8000 (RTP) and 8001 (RTCP).
#
#   Publish (the app's RTSP push):  rtsp://192.168.100.10:8554/live/test
#   Watch over TCP:                 ffplay -rtsp_transport tcp rtsp://192.168.100.10:8554/live/test
#   Watch over UDP:                 ffplay -rtsp_transport udp rtsp://192.168.100.10:8554/live/test
#
# RTSPS (RTSP over TLS) on TCP 8322, for the RTSPS push test. First make a self-signed test certificate
# from the top folder of the repository. Files ending in .local are git-ignored, so it can't be
# committed by mistake:
#
#   openssl req -x509 -newkey rsa:2048 -nodes -days 30 -subj "/CN=mediamtx-test" \
#     -keyout test/server.key.local -out test/server.crt.local
#
# Then start MediaMTX with TLS on, next to the plain ports (this also turns on RTMPS, below):
#
#   MTX_RTSPENCRYPTION=optional MTX_RTMPENCRYPTION=optional mediamtx test/mediamtx.yml
#
#   Publish (the app's RTSPS push): rtsps://192.168.100.10:8322/live/test
#   Watch:                          ffplay -rtsp_transport tcp rtsps://192.168.100.10:8322/live/test
#
# VLC can't play RTSPS. ffplay accepts the self-signed certificate because ffmpeg doesn't verify
# certificates unless asked to.

rtsp: true
rtspTransports: [udp, tcp]
rtspEncryption: "no"
rtspAddress: :8554
rtspsAddress: :8322
rtpAddress: :8000
rtcpAddress: :8001
rtspServerKey: test/server.key.local
rtspServerCert: test/server.crt.local

###############################################
# RTMP on TCP 1935.
#
#   Publish (the app's RTMP push):  URL rtmp://192.168.100.10:1935/live and stream key test
#                                   (together: rtmp://192.168.100.10:1935/live/test)
#   Watch:                          ffplay rtmp://192.168.100.10:1935/live/test
#
# RTMPS (RTMP over TLS) on TCP 1936 uses the same test certificate and start command as RTSPS above.
#
#   Publish (the app's RTMPS push): URL rtmps://192.168.100.10:1936/live and stream key test
#   Watch:                          ffplay rtmps://192.168.100.10:1936/live/test

rtmp: true
rtmpEncryption: "no"
rtmpAddress: :1935
rtmpsAddress: :1936
rtmpServerKey: test/server.key.local
rtmpServerCert: test/server.crt.local

###############################################
# SRT on UDP 8890.
#
# MediaMTX's SRT server needs a stream ID that names the action and the path: publish:<path> to send a
# stream, read:<path> to watch one.
#
#   Publish (the app's SRT caller): host 192.168.100.10, port 8890, stream ID publish:test
#   Watch:                          ffplay "srt://192.168.100.10:8890?streamid=read:test&latency=120000"
#
# ffmpeg and ffplay take SRT latency in microseconds, so latency=120000 is 120 ms. VLC ignores options in
# an SRT URL and can't send a stream ID, so use ffplay to watch.

srt: true
srtAddress: :8890

###############################################
# Paths

paths:
  # For the SRT encryption test: publishing to this path, and watching it, need the passphrase. The
  # passphrase is an example value for a test server, not a secret. The app may use AES-128 or AES-256.
  #
  #   Publish (the app's SRT caller): stream ID publish:encrypted, passphrase example-passphrase
  #   Watch: ffplay "srt://192.168.100.10:8890?streamid=read:encrypted&passphrase=example-passphrase&latency=120000"
  encrypted:
    source: publisher
    srtPublishPassphrase: example-passphrase
    srtReadPassphrase: example-passphrase

  # Every other path: any client may publish, and readers get the stream. A new publisher replaces the
  # current one, so a phone that reconnects isn't shut out by its own old session.
  all_others:
    source: publisher
    overridePublisher: true
